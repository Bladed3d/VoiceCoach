<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- CSP for DEVELOPMENT - allows everything locally -->
    <!-- TODO: Tighten this for production builds -->
    <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:; connect-src * ws://* wss://* http://* https://*;">
    <title>VoiceCoach V2</title>
  </head>
  <body>
    <div id="root"></div>

    <!-- Fallback error display if React fails to load -->
    <div id="loading-indicator" style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-family: monospace; text-align: center; z-index: 9999;">
      <div style="font-size: 24px; margin-bottom: 10px;">⏳ Loading VoiceCoach V2...</div>
      <div style="font-size: 14px; color: #888;">If this message persists, check DevTools console</div>
    </div>

    <script type="module" src="/src/main.tsx"></script>

    <!-- Remove loading indicator when React mounts -->
    <script>
      window.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
          const loadingIndicator = document.getElementById('loading-indicator');
          const root = document.getElementById('root');

          // If root is still empty after 3 seconds, show error
          if (root && root.children.length === 0) {
            loadingIndicator.innerHTML = `
              <div style="color: red; font-size: 20px; margin-bottom: 10px;">❌ React Failed to Load</div>
              <div style="color: white; font-size: 14px; margin-bottom: 5px;">Check the DevTools Console for errors</div>
              <div style="color: #888; font-size: 12px;">Press F12 or Ctrl+Shift+I to open DevTools</div>
            `;
          } else if (loadingIndicator) {
            loadingIndicator.remove();
          }
        }, 3000);
      });
    </script>
  </body>
</html>
